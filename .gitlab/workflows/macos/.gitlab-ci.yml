#
# MacOS CI jobs
#

#
# Anchors
#

macos-apple-silicon-build:
  extends: .common-ci-base
  image: macos-14-xcode-15
  stage: compile
  tags:
    - saas-macos-medium-m1
  variables:
    !reference [.compiler-variables]
  variables:
    CMAKE_GENERATOR: Ninja
    EXTRA_CFLAGS: -Wno-error -g
    EXTRA_CXXFLAGS: -Wno-error -g
  script: !reference [.compiler-script]
  artifacts:
    expire_in: 1 day
    paths:
      - Bin/Release/SvtAv1EncApp
      - Bin/Release/SvtAv1DecApp
  before_script:
    - |
      brew install cmake ninja

macos-apple-silicon-enc-dec-test:
  extends: .common-ci-base
  image: macos-14-xcode-15
  stage: test
  tags:
    - saas-macos-medium-m1
  variables:
    TEST_FILES: akiyo_cif.y4m
    SVT_ENCTEST_FILENAME: akiyo_cif.y4m
    SVT_ENCTEST_BITNESS: 8
  script: |
    function getBitStreamName {
      local preset=$1
      echo "test-${BRANCH:-pr}-$(uname)-Release-${SVT_ENCTEST_BITNESS}bit-m${preset}.ivf"
    }
    complianceFailure=0
    for preset in 2 8; do
      bitStream=$(getBitStreamName ${preset})
      recFile=$(sed 's|ivf|enc|g' <<< ${bitStream})
      decFile=$(sed 's|ivf|dec|g' <<< ${bitStream})
      ./Bin/Release/SvtAv1EncApp --preset ${preset} -i ${SVT_ENCTEST_FILENAME} -n 17 -b ${bitStream} -o ${recFile}
      ./Bin/Release/SvtAv1DecApp -i ${bitStream} -o ${decFile}
      if [[ $(diff -q ${recFile} ${decFile} | wc -l) -gt 0 ]]; then
        complianceFailure=1
        break
      fi
    done
    test ${complianceFailure} -eq 0
  needs:
    - macos-apple-silicon-build
  before_script:
    - |
      for file in $TEST_FILES; do
        curl -fLs "https://gitlab.com/AOMediaCodec/aom-testing/-/raw/master/test-files/$file.zst" | zstd -d - -o "$file"
      done

.macos-compiler-base:
  extends: .common-ci-base
  stage: compile
  tags:
    - macos-ci
  variables:
    !reference [.compiler-variables]
  script: !reference [.compiler-script]

.macos-test-base:
  extends: .common-ci-base
  stage: test
  tags:
    - macos-ci
  before_script:
    - |
      for file in $TEST_FILES; do
        curl -fLs "https://gitlab.com/AOMediaCodec/aom-testing/-/raw/master/test-files/$file.zst" | zstd -d - -o "$file"
      done

.macos-unit-test-base:
  extends: .macos-test-base
  artifacts:
    when: always
    reports:
      junit: reports/*.xml
  needs:
    - macOS (Static, Tests)

#
# Compile jobs
#

macOS (Static, Tests):
  extends: .macos-compiler-base
  variables:
    CMAKE_GENERATOR: Xcode
  parallel:
    matrix:
      - CMAKE_GENERATOR: Xcode
      - CMAKE_GENERATOR: Ninja
        EXTRA_CMAKE_FLAGS: -DBUILD_TESTING=ON
        EXTRA_CFLAGS: -Wno-error -g
        EXTRA_CXXFLAGS: -Wno-error -g
        PREFIX_DIR: ${CI_PROJECT_DIR}/SVT-Install/
        TARGET: install
  artifacts:
    expire_in: 1 day
    paths:
      - Bin/Release/SvtAv1EncApp
      - Bin/Release/SvtAv1DecApp
      - Bin/Release/*
      - SVT-Install/*

#
# Test jobs
#

macOS Unit Tests:
  extends: .macos-unit-test-base
  variables:
    SVT_AV1_TEST_VECTOR_PATH: $CI_PROJECT_DIR/test/vectors
    TOTAL_SHARDS: 4
  parallel:
    matrix:
      - SHARD_INDEX: [0, 1, 2, 3]
  cache:
    key: testvectors
    paths:
      - test/vectors
    policy: pull-push
  before_script:
    - curl -Ls "https://raw.githubusercontent.com/1480c1/gtest-parallel/unique_id/gtest_parallel.py" > gtest_parallel.py
  script:
    - cmake -B Build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
    - cmake --build Build --target TestVectors
    - python3 gtest_parallel.py --print_test_times --shard_index=$SHARD_INDEX --shard_count=$TOTAL_SHARDS ./Bin/Release/SvtAv1UnitTests ./Bin/Release/SvtAv1E2ETests -- --gtest_output="xml:reports/{#}.xml"

macOS Enc Test:
  extends: .macos-test-base
  variables:
    TEST_FILES: akiyo_cif.y4m Chimera-Aerial_480x264_2997fps_10bit_420_150frames.y4m
  script: !reference [.enc-test-script]
  parallel: !reference [.enc-test-parallel]
  artifacts: !reference [.enc-test-artifacts]
  needs:
    - macOS (Static, Tests)

macOS FFmpeg (Static):
  extends: .macos-test-base
  stage: compile
  variables:
    CFLAGS: -pipe
    CXXFLAGS: -pipe
    LDFLAGS: -pipe
    GIT_DEPTH: 0
    PREFIX_DIR: ${CI_PROJECT_DIR}/SVT-Install/
  before_script:
    - !reference [.ffmpeg-before-script-clone]
    - !reference [.ffmpeg-before-script-export]
  script:
    - !reference [.ffmpeg-svtav1-script]
    - !reference [.ffmpeg-aom-script]
    - !reference [.ffmpeg-libvpx-script]
    - !reference [.ffmpeg-dav1d-script]
    - !reference [.ffmpeg-vmaf-script]
    # symbol conflict tests
    - |
      conflicts=$(
        nm -Ag --defined-only ${PREFIX_DIR}/lib/lib{SvtAv1Enc,aom,dav1d,vpx,vmaf}.a 2>/dev/null |
        cut -d' ' -f 4 |
        sort |
        uniq -d
      )
      if [ -n "$conflicts" ]; then
        printf 'Conflicts Found!\n'
        for conflict in $conflicts; do
          nm -Ag --defined-only ${PREFIX_DIR}/lib/lib{SvtAv1Enc,aom,dav1d,vpx,vmaf}.a 2>/dev/null |
          sort -k3 |
          grep -- " $conflict$"
        done
        exit 1
      fi
    - !reference [.ffmpeg-ffmpeg-script]
    - ccache -s
  artifacts:
    untracked: false
    expire_in: 30 days
    paths:
      - ffmpeg
